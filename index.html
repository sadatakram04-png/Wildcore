 strength:{id:'strength',name:'قوة الميدان',kind:'STRENGTH / A',level:'متوسط',duration:45,focus:'القوة الوظيفية والجذع',description:'حصة قوة بوزن الجسم لبناء قاعدة متوازنة. ركّز على التقنية قبل السرعة.',exercises:[['Push-ups','3 × 10–15','راحة 60 ثانية'],['Bodyweight Squats','3 × 15','راحة 60 ثانية'],['Reverse Lunges','3 × 10 لكل رجل','راحة 45 ثانية'],['Plank','3 × 30–45 ثانية','راحة 45 ثانية'],['Glute Bridge','3 × 15','راحة 45 ثانية']]},

function weekSessions(){const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-((start.getDay()+6)%7));return state.sessions.filter(s=>new Date(`${s.date}T12:00:00`)>=start)}
function readiness(){const sleep=state.sleepLogs[0]?.hours;const water=Math.min(100,state.water/state.profile.waterTarget*100);const sl=typeof sleep==='number'?Math.min(100,sleep/state.profile.sleepTarget*100):65;return Math.round((water*.35+sl*.45+65*.2))}
function coachInsights(){const sleep=state.sleepLogs[0]?.hours,week=weekSessions(),last7=state.sessions.filter(x=>daysAgo(x.date)<=6),last14=state.sessions.filter(x=>daysAgo(x.date)<=13),avg=last7.length,previous=Math.max(0,last14.length-avg),completed=week.length,waterPct=Math.round(Math.min(100,state.water/state.profile.waterTarget*100)),weight=state.weightLogs.slice(-2),notes=[];let status='متوازن',priority='حافظ على الإيقاع',detail='سجّل الحصص والنوم بانتظام حتى تصبح التوصيات أدق.';if(typeof sleep==='number'&&sleep<6){status='استرجاع منخفض';priority='خفّف الشدة اليوم';detail='آخر نوم مسجل أقل من 6 ساعات. اختر المشي أو المرونة، ولا تنفذ السرعات القصوى اليوم.';notes.push('النوم هو الأولوية: حاول تثبيت موعد النوم وامنح نفسك فرصة كافية للراحة.')}else if(typeof sleep==='number'&&sleep>=7&&waterPct>=60){status='جاهزية جيدة';priority='حصة بجودة عالية';detail='النوم والترطيب المسجلان يدعمان حصة عادية إذا كان إحساسك الجسدي جيداً. ابدأ بإحماء ولا تتجاوز التقنية.';}if(waterPct<45)notes.push('الترطيب المسجل منخفض مقارنة بهدفك. وزّع الماء على اليوم ولا تشرب كمية كبيرة دفعة واحدة.');if(completed>=3)notes.push('أنجزت 3 حصص هذا الأسبوع. لا تضف حصة قوية رابعة تلقائياً؛ اجعلها حركة خفيفة أو استرجاعاً.');else notes.push(`سجلت ${completed} من 3 حصص مستهدفة هذا الأسبوع. الحصة التالية المقترحة: ${completed===0?'قوة الميدان':completed===1?'سرعة ومناورة':'تحمّل واستكشاف'}.`);if(last14.length>=2){const delta=avg-previous;notes.push(delta>0?'وتيرة نشاطك في آخر 7 أيام أعلى من الأيام السبعة السابقة؛ لا ترفع الحجم أكثر من ذلك هذا الأسبوع.':delta<0?'نشاطك أقل من الأسبوع السابق؛ ارجع تدريجياً بحصة واحدة، لا تحاول تعويض كل ما فات.':'وتيرة نشاطك مستقرة؛ ثبّت الحمل قبل زيادته.')}if(weight.length===2){const d=Number((weight[1].value-weight[0].value).toFixed(1));notes.push(`فرق آخر قياسين للوزن ${d>0?'+':''}${d} كغ. قياسان وحدهما لا يكفيان لاستنتاج تغير حقيقي؛ راقب الاتجاه على مدى أسابيع.`)}return {status,priority,detail,notes,completed,waterPct,weeklyMinutes:week.reduce((a,x)=>a+(x.duration||0),0),forecast:forecastText()}}
function daysAgo(date){return Math.floor((new Date(`${today()}T12:00:00`)-new Date(`${date}T12:00:00`))/86400000)}
function forecastText(){const recent=state.sessions.filter(x=>daysAgo(x.date)<=27),count=recent.length,avg=count/4,project=Math.round(avg*4);if(count<2)return 'لا توجد بيانات كافية بعد. سجّل حصتين على الأقل لبدء تقدير اتجاهك.';return `بناءً على آخر 4 أسابيع: متوسطك ${avg.toFixed(1)} حصة أسبوعياً. إذا حافظت على نفس الوتيرة، قد تسجل قرابة ${project} حصة خلال الأسابيع الأربعة القادمة. هذا إسقاط حسابي وليس ضماناً للأداء.`}

function coachPage(){const x=coachInsights();return `${pageTitle('WILDCORE INTELLIGENCE / AI COACH','المدرب الذكي','مساعد تكتيكي محلي يحلل سجلاتك ويقترح الخطوة التالية.')}<div class="coach-hero"><div class="coach-avatar">✦</div><div><div class="coach-label">AMETHYST COACH · PERSONAL ANALYSIS</div><h2 style="font-size:19px;margin:6px 0">${x.status}</h2><p style="font-size:11px;color:var(--muted);margin:0">${x.priority}</p></div></div><div class="metric-row" style="margin-top:12px"><div class="metric"><strong>${x.completed}/3</strong><small>حصص الأسبوع</small></div><div class="metric"><strong>${x.weeklyMinutes}</strong><small>دقائق النشاط</small></div><div class="metric"><strong>${x.waterPct}%</strong><small>هدف الماء اليوم</small></div></div><div class="panel"><div class="eyebrow">تقرير المدرب</div><p style="font-size:13px;line-height:1.9;margin:8px 0">${x.detail}</p>${x.notes.map((n,i)=>`<div class="coach-note"><b>ملاحظة ${i+1}</b><p>${n}</p></div>`).join('')}</div><div class="panel"><div class="eyebrow">توقعات الأداء · 4 أسابيع</div><p style="font-size:12px;line-height:1.9">${x.forecast}</p><p style="font-size:10px;color:var(--muted)">التوقعات تعتمد على سجلاتك الفعلية فقط؛ لا تتنبأ بالسرعة أو العضلات أو النتائج الطبية.</p></div><div class="panel"><div class="eyebrow">اسأل المدرب</div><div class="field"><label for="coachQuestion">اكتب سؤالك عن التدريب أو الاسترجاع</label><textarea id="coachQuestion" rows="3" placeholder="مثلاً: كيف نطوّر عدد Push-ups؟"></textarea></div><button class="primary-btn full" data-action="ask-coach">تحليل السؤال</button><div id="coachAnswer">${state.coachMessages.slice(-3).map(m=>`<div class="coach-note"><b>أنت: ${esc(m.q)}</b><p>${esc(m.a)}</p></div>`).join('')}</div></div><div class="panel"><div class="eyebrow">دفتر ملاحظاتك التدريبية</div><div class="field"><label for="coachNote">سجّل إحساسك أو ملاحظة بعد الحصة</label><textarea id="coachNote" rows="2" placeholder="مثلاً: الركبة كانت متعبة، التنفس تحسن..."></textarea></div><button class="secondary-btn full" data-action="save-coach-note">حفظ الملاحظة</button>${state.coachNotes.slice(-5).reverse().map(n=>`<div class="coach-note"><small>${dateLabel(n.date)}</small><p>${esc(n.text)}</p></div>`).join('')}</div><div class="coach-disclaimer">تنبيه: هذا مدرب تحليلي يعمل داخل الهاتف بقواعد وتقديرات مبنية على سجلاتك، وليس نموذج ذكاء اصطناعي سحابياً أو طبيباً. لا تتدرّب عبر الألم أو الدوخة.</div>`}
function coachAnswer(q){const t=q.toLowerCase(),sleep=state.sleepLogs[0]?.hours,week=weekSessions().length;if(/push|ضغط|بوش|صدر/.test(t))return 'ابدأ بمجموعات تترك 2–3 تكرارات ممكنة قبل الفشل. عندما تنجز الحد الأعلى في كل المجموعات بتقنية سليمة في حصتين متتاليتين، زد 1–2 تكرار أو انتقل لنسخة أصعب مثل incline ثم standard ثم decline. لا ترفع التكرار والصعوبة معاً.';if(/جري|ركض|تحمل|نفس/.test(t))return 'طوّر التحمل بزيادة صغيرة: أضف 3–5 دقائق إلى جري مريح واحد أسبوعياً، مع بقاء الوتيرة تسمح بالكلام. لا ترفع المدة والسرعة في الأسبوع نفسه.';if(/مرون|تمطيط|stretch|mobility/.test(t))return 'خصص 8–12 دقيقة بعد الإحماء أو في يوم خفيف: حركة الكاحل، فتح الورك، دوران الصدر والكتف. اثبت في مدى مريح دون ألم أو ارتداد قوي.';if(/نوم|استرجاع|تعب|راحة/.test(t))return typeof sleep==='number'&&sleep<6?'سجّلت أقل من 6 ساعات في آخر نوم. اجعل اليوم خفيفاً أو راحة، وراقب التعب. إذا استمر الإرهاق أو صاحبه ألم غير معتاد، أوقف التدريب واطلب تقييماً مختصاً.':'اجعل بين حصص القوة الشديدة يوماً أخف أو راحة. سجّل ساعات النوم وجودته والطاقة حتى نرى النمط عبر عدة أيام.';if(/عضل|ضخام|قوة|تمارين/.test(t))return 'ركّز على الأساسيات: Push-ups، Squats، Reverse Lunges، Glute Bridge، Row بحقيبة آمنة إن توفرت، وPlank. نفّذ 2–3 مجموعات بتقنية نظيفة، ثم زد تدريجياً بعد إتقان المستوى الحالي.';return `حسب سجلك الحالي أنجزت ${week} حصص هذا الأسبوع. حدّد هدفاً واحداً قابلاً للقياس، وسجّل النوم والطاقة والأداء بعد الحصة. ${coachInsights().detail} اكتب سؤالك بشكل أدق (تمرين، عدد التكرارات، أو هدف) لأعطيك توجيهاً أكثر تحديداً.`}

function recovery(){const last=state.sleepLogs[0];return `${pageTitle('RECOVERY & READINESS / 03','الاسترجاع','القوة لا تُبنى بالتمرين فقط. سجّل نومك وشعورك.')}
<div class="panel"><div class="eyebrow latin">SLEEP LOG</div><h2 style="font-size:16px;margin:8px 0">تسجيل النوم الأخير</h2><div class="field-row"><div class="field"><label for="sleepHours">عدد الساعات</label><input id="sleepHours" type="number" min="0" max="24" step="0.25" placeholder="مثلاً 7.5" value="${typeof last?.hours==='number'?last.hours:''}"></div><div class="field"><label for="sleepQuality">جودة النوم</label><select id="sleepQuality"><option value="مقبول">مقبول</option><option value="جيد" ${last?.quality==='جيد'?'selected':''}>جيد</option><option value="ممتاز" ${last?.quality==='ممتاز'?'selected':''}>ممتاز</option><option value="متقطع" ${last?.quality==='متقطع'?'selected':''}>متقطع</option></select></div></div><button class="primary-btn full" data-action="save-sleep">حفظ سجل النوم</button></div>
<div class="panel"><div class="eyebrow latin">BODY METRICS</div><h2 style="font-size:16px;margin:8px 0">تسجيل الوزن</h2><div class="field"><label for="weightInput">الوزن بالكيلوغرام (kg)</label><input id="weightInput" type="number" min="20" max="400" step="0.1" placeholder="مثلاً 72.5"></div><button class="secondary-btn full" data-action="save-weight">إضافة قياس</button>${state.weightLogs.length?`<div class="divider"></div>${state.weightLogs.slice(-5).reverse().map(w=>`<div class="log-row"><span>${dateLabel(w.date)}</span><b class="latin">${w.value} kg</b></div>`).join('')}`:''}</div>
<div class="panel"><div class="eyebrow latin">MOBILITY / RESET</div><h2 style="font-size:16px;margin:8px 0">إعادة ضبط الجسم</h2><p style="color:var(--muted);font-size:11px;line-height:1.8">جلسة حركة خفيفة في الأيام الفاصلة: تنفس هادئ، حركة للكاحل والورك والكتف، وتمطيط مريح دون ألم.</p><button class="secondary-btn full" data-open-workout="mobility">بدء جلسة الاسترجاع</button></div>`}
function progress(){const ws=weekSessions(),total=state.sessions.length,mins=state.sessions.reduce((a,s)=>a+(s.duration||0),0),weights=state.weightLogs.slice(-7);let chart='';if(weights.length>1){const vals=weights.map(x=>x.value),min=Math.min(...vals)-1,max=Math.max(...vals)+1,pts=vals.map((v,i)=>`${30+i*(300/(vals.length-1))},${110-(v-min)/(max-min)*85}`).join(' ');chart=`<polyline points="${pts}" fill="none" stroke="#c5a3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${30+i*(300/(vals.length-1))}" cy="${110-(v-min)/(max-min)*85}" r="4" fill="#c5a3ff"/>`).join('')}`}return `${pageTitle('PERFORMANCE INTELLIGENCE / 04','مركز التقدم','الأرقام تساعدك تشوف الاستمرارية، وليس للحكم على قيمتك.')}
<div class="metric-row"><div class="metric"><strong>${total}</strong><small>حصة مكتملة</small></div><div class="metric"><strong>${mins}</strong><small>دقيقة نشاط</small></div><div class="metric"><strong>${ws.length}</strong><small>هذا الأسبوع</small></div></div>
<div class="panel"><div class="section-head" style="margin-top:0"><div><h2>مسار الوزن</h2><p>WEIGHT TREND · آخر 7 قياسات</p></div></div>${weights.length>1?`<svg class="chart" viewBox="0 0 360 130" role="img" aria-label="مخطط تغير الوزن"><path d="M20 110 H345" stroke="#493858" stroke-width="1"/>${chart}</svg><div class="chart-labels"><span>${weights[0].date}</span><span>${weights[weights.length-1].date}</span></div>`: '<div class="empty">سجّل قياسين أو أكثر للوزن حتى يظهر المنحنى.</div>'}</div>
<div class="section-head"><div><h2>سجل العمليات</h2><p>TRAINING HISTORY</p></div></div><div class="panel">${state.sessions.length?state.sessions.slice().reverse().slice(0,12).map(s=>`<div class="log-row"><div><b>${esc(s.name)}</b><small style="display:block;color:var(--muted);margin-top:3px">${dateLabel(s.date)}</small></div><div class="latin" style="text-align:left;color:var(--lime)">${s.duration} MIN</div></div>`).join(''):'<div class="empty">مازال ما عندك حتى حصة مسجلة. ابدأ أول مهمة من قسم التدريب.</div>'}</div>
<div class="coach"><div class="coach-label">CONSISTENCY REPORT</div><p>${total===0?'الميدان ينتظرك. أول حصة هي بداية السجل، وليس مطلوباً أن تكون مثالية.':`سجلت ${total} حصص. حافظ على التدرّج وسجّل أيام الراحة كذلك. الاستمرارية أهم من رفع الحمل بسرعة.`}</p></div>`}
function profile(){return `${pageTitle('OPERATOR PROFILE / 05','ملفك الشخصي','اضبط أهداف النظام واحتفظ بنسخة من بياناتك.')}
<div class="panel"><div class="profile-head"><div class="profile-badge">W</div><div><h2>${esc(state.profile.name)}</h2><p class="latin">WILDCORE MEMBER · PERSONAL</p></div></div><div class="divider"></div><div class="field"><label for="profileName">اسم العرض</label><input id="profileName" maxlength="32" value="${esc(state.profile.name)}"></div><div class="field"><label for="profileGoal">هدفك الرئيسي</label><select id="profileGoal"><option ${state.profile.goal==='القوة + الرشاقة + المرونة'?'selected':''}>القوة + الرشاقة + المرونة</option><option ${state.profile.goal==='التحمل واللياقة'?'selected':''}>التحمل واللياقة</option><option ${state.profile.goal==='بناء العضلات'?'selected':''}>بناء العضلات</option><option ${state.profile.goal==='المرونة والحركة'?'selected':''}>المرونة والحركة</option></select></div><div class="field-row"><div class="field"><label for="waterGoal">هدف الماء (ml)</label><input id="waterGoal" type="number" min="500" max="6000" step="250" value="${state.profile.waterTarget}"></div><div class="field"><label for="sleepGoal">هدف النوم (ساعات)</label><input id="sleepGoal" type="number" min="4" max="12" step="0.5" value="${state.profile.sleepTarget}"></div></div><button class="primary-btn full" data-action="save-profile">حفظ الإعدادات</button></div>
<div class="panel"><div class="eyebrow latin">DATA CONTROL / PRIVACY</div><h2 style="font-size:15px;margin:8px 0">بياناتك ملكك</h2><p style="font-size:11px;color:var(--muted);line-height:1.8">كل السجلات محفوظة محلياً في متصفح هذا الجهاز. صدّر نسخة احتياطية قبل تغيير الهاتف أو مسح بيانات Safari.</p><div style="display:flex;gap:8px"><button class="secondary-btn" style="flex:1" data-action="export">تصدير نسخة JSON</button><button class="secondary-btn" style="flex:1" data-action="import">استيراد نسخة</button></div><input type="file" id="importFile" accept="application/json,.json" class="hidden"><div class="divider"></div><button class="danger-btn full" data-action="reset">مسح جميع بياناتي</button></div>
<div class="panel"><div class="eyebrow latin">SYSTEM CAPABILITIES</div><div class="log-row"><span>التدريب والتوقيت والحفظ المحلي</span><b style="color:var(--lime)">ACTIVE</b></div><div class="log-row"><span>تتبّع GPS أثناء فتح الصفحة</span><b style="color:var(--lime)">AVAILABLE</b></div><div class="log-row"><span>المزامنة السحابية بين الأجهزة</span><b style="color:var(--orange)">NOT CONNECTED</b></div><div class="log-row"><span>AI سحابي محادثي</span><b style="color:var(--orange)">NOT CONNECTED</b></div><div class="log-row"><span>Apple Health / HealthKit</span><b style="color:var(--orange)">NATIVE APP NEEDED</b></div></div>`}
function render(){const s=$('#screen');if(currentView==='home')s.innerHTML=home();else if(currentView==='train')s.innerHTML=train();else if(currentView==='fuel')s.innerHTML=fuel();else if(currentView==='recovery')s.innerHTML=recovery();else if(currentView==='progress')s.innerHTML=progress();else if(currentView==='coach')s.innerHTML=coachPage();else if(currentView==='profile')s.innerHTML=profile();if(state.activeWorkout&&currentView==='train')startTimerUI();}
function fmtTime(sec){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function startTimerUI(){clearInterval(timerInterval);timerInterval=setInterval(()=>{const el=$('#workoutTimer'),a=state.activeWorkout;if(!el||!a){clearInterval(timerInterval);return}const sec=Math.max(0,Math.floor((Date.now()-a.startedAt)/1000)-(a.pausedSeconds||0));el.textContent=fmtTime(sec)},1000)}
function openModal(html){$('#modal').innerHTML=html;$('#modalBackdrop').classList.add('open')}
function closeModal(){$('#modalBackdrop').classList.remove('open')}
function showWorkout(id){const w=workouts[id];if(!w)return;selectedWorkout=id;openModal(`<div class="modal-head"><h2>${w.name}</h2><button class="close" data-close>×</button></div><div class="eyebrow latin" style="margin-top:10px">${w.kind} · ${w.duration} MIN</div><p style="font-size:11px;color:var(--muted);line-height:1.8">${w.description}</p><div class="divider"></div>${w.exercises.map((ex,i)=>`<div class="exercise"><div class="num">${String(i+1).padStart(2,'0')}</div><div><b>${ex[0]}</b><small>${ex[1]} · ${ex[2]}</small></div></div>`).join('')}<p style="font-size:10px;color:var(--muted);line-height:1.7">ابدأ بإحماء مناسب. أوقف التمرين عند الألم أو الدوخة أو ضيق النفس غير المعتاد، وعدّل التكرارات حسب مستواك.</p><button class="primary-btn full" data-start-workout="${id}">بدء المهمة</button>`)}
function beginWorkout(id){state.activeWorkout={id,startedAt:Date.now(),done:[],pausedSeconds:0};save();closeModal();nav('train');toast('بدأت المهمة. ركّز على التقنية.')}
function finishWorkout(){const a=state.activeWorkout;if(!a)return;const sec=Math.max(60,Math.floor((Date.now()-a.startedAt)/1000)-(a.pausedSeconds||0));state.sessions.push({id:uid(),date:today(),name:workouts[a.id].name,type:a.id,duration:Math.max(1,Math.round(sec/60)),completed:a.done.length,total:workouts[a.id].exercises.length});state.activeWorkout=null;save();clearInterval(timerInterval);render();toast('تم حفظ الحصة في سجل التقدم')}
function addWater(n){state.water=Math.max(0,Math.min(10000,state.water+n));save();render();toast(n>0?`تمت إضافة ${n} ml`:'تم تعديل الكمية')}
function addMeal(){openModal(`<div class="modal-head"><h2>تسجيل وجبة</h2><button class="close" data-close>×</button></div><div class="field"><label for="mealType">نوع الوجبة</label><select id="mealType"><option>فطور</option><option>غداء</option><option>عشاء</option><option>وجبة خفيفة</option></select></div><div class="field"><label for="mealName">ماذا أكلت؟</label><input id="mealName" maxlength="90" placeholder="مثلاً: بيض، خبز، سلطة"></div><button class="primary-btn full" data-action="save-meal">حفظ الوجبة</button>`)}
function startGPS(){if(!('geolocation'in navigator)){toast('GPS غير مدعوم في هذا المتصفح');return}if(!window.isSecureContext){toast('GPS يحتاج رابط HTTPS آمن');return}if(!state.gpsRun)state.gpsRun={distance:0,status:'running',startedAt:Date.now(),points:0};else state.gpsRun.status='running';lastGPS=null;gpsWatch=navigator.geolocation.watchPosition(pos=>{const c={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy};if(c.accuracy>60)return;if(lastGPS){const d=distance(lastGPS,c);if(d>0.003&&d<0.5)state.gpsRun.distance+=d}lastGPS=c;state.gpsRun.points++;save();if(currentView==='train'){const el=$('.gps-distance');if(el)el.innerHTML=`${state.gpsRun.distance.toFixed(2)} <small style="font-size:14px">KM</small>`}},err=>{toast(err.code===1?'رفضت إذن الموقع':err.code===2?'إشارة GPS غير متاحة':'انتهت مهلة GPS');},{enableHighAccuracy:true,maximumAge:3000,timeout:15000});save();render();toast('بدأ GPS. اترك الصفحة مفتوحة أثناء الجري.')}
function distance(a,b){const R=6371,rad=x=>x*Math.PI/180,dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon),x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function finishGPS(){if(gpsWatch!==null)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;if(!state.gpsRun)return;const mins=Math.max(1,Math.round((Date.now()-state.gpsRun.startedAt)/60000));state.sessions.push({id:uid(),date:today(),name:'جري خارجي GPS',type:'gps',duration:mins,distance:Number(state.gpsRun.distance.toFixed(2))});state.gpsRun=null;lastGPS=null;save();render();toast('تم حفظ جولة الجري')}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`wildcore-backup-${today()}.json`;document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);toast('تم تجهيز النسخة الاحتياطية')}
function safeImport(obj){if(!obj||typeof obj!=='object'||!obj.profile||!Array.isArray(obj.sessions)||!Array.isArray(obj.meals)||!Array.isArray(obj.weightLogs)||!Array.isArray(obj.sleepLogs))throw new Error('invalid');const fresh=defaults();state={...fresh,...obj,version:3,profile:{...fresh.profile,...obj.profile},activeWorkout:null,gpsRun:null};save();render();toast('تم استيراد بياناتك')}
$('#screen').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.goto){nav(b.dataset.goto);return}if(b.dataset.openWorkout){showWorkout(b.dataset.openWorkout);return}if(b.dataset.startWorkout){beginWorkout(b.dataset.startWorkout);return}if(b.dataset.close!==undefined){closeModal();return}if(b.dataset.water){addWater(Number(b.dataset.water));return}if(b.dataset.action==='add-meal'){addMeal();return}if(b.dataset.action==='save-meal'){const name=$('#mealName').value.trim();if(!name){toast('اكتب اسم الوجبة أولاً');return}state.meals.push({id:uid(),date:today(),type:$('#mealType').value,name});save();closeModal();render();toast('تم تسجيل الوجبة');return}if(b.dataset.deleteMeal){state.meals=state.meals.filter(m=>m.id!==b.dataset.deleteMeal);save();render();toast('تم حذف السجل');return}if(b.dataset.action==='save-sleep'){const h=Number($('#sleepHours').value);if(!Number.isFinite(h)||h<0||h>24){toast('أدخل ساعات نوم صحيحة');return}state.sleepLogs.unshift({date:today(),hours:h,quality:$('#sleepQuality').value});state.sleepLogs=state.sleepLogs.slice(0,90);state.tasks.sleep=true;save();render();toast('تم حفظ النوم');return}if(b.dataset.action==='save-weight'){const v=Number($('#weightInput').value);if(!Number.isFinite(v)||v<20||v>400){toast('تحقق من الوزن المدخل');return}state.weightLogs.push({date:today(),value:Number(v.toFixed(1))});save();render();toast('تم تسجيل الوزن');return}if(b.dataset.action==='save-profile'){const name=$('#profileName').value.trim()||'FIELD OPERATIVE',water=Number($('#waterGoal').value),sleep=Number($('#sleepGoal').value);if(water<500||water>6000||sleep<4||sleep>12){toast('راجع أهداف الماء والنوم');return}state.profile={...state.profile,name,goal:$('#profileGoal').value,waterTarget:water,sleepTarget:sleep};save();render();toast('تم حفظ ملفك');return}if(b.dataset.action==='ask-coach'){const q=$('#coachQuestion').value.trim();if(!q){toast('اكتب سؤالك أولاً');return}const a=coachAnswer(q);state.coachMessages.push({q,a,date:today()});state.coachMessages=state.coachMessages.slice(-30);save();render();toast('اكتمل تحليل المدرب');return}if(b.dataset.action==='save-coach-note'){const text=$('#coachNote').value.trim();if(!text){toast('اكتب ملاحظة قصيرة أولاً');return}state.coachNotes.push({date:today(),text});state.coachNotes=state.coachNotes.slice(-100);save();render();toast('تم حفظ ملاحظتك');return}if(b.dataset.action==='export'){exportData();return}if(b.dataset.action==='import'){$('#importFile').click();return}if(b.dataset.action==='reset'){openModal(`<div class="modal-head"><h2>تأكيد مسح البيانات</h2><button class="close" data-close>×</button></div><p style="font-size:12px;color:var(--muted);line-height:1.8">سيتم حذف سجلات التدريب والماء والنوم والوزن والوجبات من هذا الجهاز. صدّر نسخة احتياطية أولاً إن احتجتها.</p><div style="display:flex;gap:8px"><button class="danger-btn" style="flex:1" data-confirm-reset>نعم، امسح الكل</button><button class="secondary-btn" style="flex:1" data-close>إلغاء</button></div>`);return}if(b.dataset.confirmReset!==undefined){state=defaults();save();closeModal();nav('home');toast('تمت إعادة ضبط النظام');return}if(b.dataset.workout==='finish'){finishWorkout();return}if(b.dataset.workout==='cancel'){state.activeWorkout=null;save();clearInterval(timerInterval);render();toast('تم إلغاء الحصة');return}if(b.dataset.gps==='start'){startGPS();return}if(b.dataset.gps==='finish'){finishGPS();return}if(b.dataset.gps==='pause'){if(state.gpsRun.status==='running'){state.gpsRun.status='paused';if(gpsWatch!==null)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null}else{state.gpsRun.status='running';lastGPS=null;startGPS();return}save();render();return}});
$('#screen').addEventListener('change',e=>{if(e.target.dataset.task){state.tasks[e.target.dataset.task]=e.target.checked;save();render()}if(e.target.dataset.exercise!==undefined&&state.activeWorkout){const i=Number(e.target.dataset.exercise),arr=new Set(state.activeWorkout.done);e.target.checked?arr.add(i):arr.delete(i);state.activeWorkout.done=[...arr];save();render()}});
$('#modal').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.close!==undefined){closeModal();return}if(b.dataset.startWorkout){beginWorkout(b.dataset.startWorkout);return}if(b.dataset.action==='save-meal'){const name=$('#mealName').value.trim();if(!name){toast('اكتب اسم الوجبة أولاً');return}state.meals.push({id:uid(),date:today(),type:$('#mealType').value,name});save();closeModal();render();toast('تم تسجيل الوجبة');return}});
$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
$$('.nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.view)));
$('#quickProfile').addEventListener('click',()=>nav('profile'));
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files?.[0]){const file=e.target.files[0],reader=new FileReader();reader.onload=()=>{try{safeImport(JSON.parse(reader.result))}catch(err){toast('ملف النسخة الاحتياطية غير صالح')}};reader.readAsText(file);e.target.value=''}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
})();
</script>
</body>
</html>
